name: Generate GitHub Contribution Grid Animation

on:
  schedule:
    # Run once every 24 hours at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Cyber Contribution Grid Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#111827,#1E293B,#0284C7,#818CF8,#C084FC

      - name: Commit & Push generated assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(telemetry): update dynamic contribution grid [skip ci]"
          git push
