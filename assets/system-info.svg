<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%">
  <defs>
    <linearGradient id="infoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16"/>
      <stop offset="100%" stop-color="#0E1324"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseGreen {
      0%, 100% { fill: #10B981; }
      50% { fill: #34D399; filter: drop-shadow(0 0 5px #10B981); }
    }
    .cursor-box { animation: blink 1s infinite; }
    .status-dot { animation: pulseGreen 2s infinite; }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="536" height="376" rx="10" fill="url(#infoBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Title Bar -->
  <rect x="2" y="2" width="536" height="32" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
  <circle cx="18" cy="16" r="4.5" class="status-dot"/>
  <text x="32" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">SYSTEM.INFO // DEVELOPER_IDENTITY_SPEC</text>
  <rect x="420" y="8" width="102" height="16" rx="3" fill="#064E3B" stroke="#059669" stroke-width="0.7"/>
  <text x="471" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34D399">STATUS: ACTIVE</text>

  <!-- Cyber Bracket Corners -->
  <path d="M 12 44 L 12 56" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 12 44 L 24 44" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 528 44 L 528 56" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 528 44 L 516 44" fill="none" stroke="#38BDF8" stroke-width="2"/>

  <!-- Terminal Content Lines -->
  <g transform="translate(24, 62)">
    
    <!-- Item 1: Role -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748B">[01] PRIMARY_ROLE</text>
      <text x="175" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38BDF8">AI-Integrated Full Stack Dev</text>
      <line x1="0" y1="26" x2="490" y2="26" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 4"/>
    </g>

    <!-- Item 2: Education -->
    <g transform="translate(0, 40)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748B">[02] EDUCATION</text>
      <text x="175" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#F1F5F9">B.Tech Information Technology</text>
      <line x1="0" y1="26" x2="490" y2="26" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 4"/>
    </g>

    <!-- Item 3: Core Web -->
    <g transform="translate(0, 80)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748B">[03] WEB_ENGINE</text>
      <text x="175" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34D399">React • Node.js • Express • REST</text>
      <line x1="0" y1="26" x2="490" y2="26" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 4"/>
    </g>

    <!-- Item 4: Programming -->
    <g transform="translate(0, 120)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748B">[04] CORE_LANGS</text>
      <text x="175" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#FBBF24">Python • Java • TypeScript • C</text>
      <line x1="0" y1="26" x2="490" y2="26" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 4"/>
    </g>

    <!-- Item 5: AI & LLMs -->
    <g transform="translate(0, 160)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748B">[05] AI_SPECIALTY</text>
      <text x="175" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#A855F7">LLM RAG • Multi-Turn Agents • CV</text>
      <line x1="0" y1="26" x2="490" y2="26" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 4"/>
    </g>

    <!-- Item 6: Workflows -->
    <g transform="translate(0, 200)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748B">[06] AUTONOMY</text>
      <text x="175" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#60A5FA">Agentic Tool Calling Workflows</text>
      <line x1="0" y1="26" x2="490" y2="26" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 4"/>
    </g>

    <!-- Item 7: Availability -->
    <g transform="translate(0, 240)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748B">[07] OPPORTUNITY</text>
      <text x="175" y="14" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34D399">Open to Software / AI Roles</text>
      <line x1="0" y1="26" x2="490" y2="26" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 4"/>
    </g>

  </g>

  <!-- Bottom Console Status Prompt -->
  <g transform="translate(24, 342)">
    <rect x="0" y="0" width="490" height="24" rx="4" fill="#0A0E1A" stroke="#1E293B" stroke-width="0.8"/>
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8">
      <tspan fill="#38BDF8">jaichandran@core</tspan>:<tspan fill="#A855F7">~</tspan>$ ping -c 1 production_ready
    </text>
    <text x="340" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#34D399">0% packet loss (ACK)</text>
    <rect x="472" y="5" width="6" height="14" fill="#38BDF8" class="cursor-box"/>
  </g>
</svg>
