<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 80" width="100%" height="auto">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#06201c"/>
      <stop offset="100%" stop-color="#020705"/>
    </radialGradient>
    <radialGradient id="orbG" cx="40%" cy="34%" r="65%">
      <stop offset="0%"  stop-color="#bdfff2"/>
      <stop offset="26%" stop-color="#29c9ad"/>
      <stop offset="58%" stop-color="#0d5e51"/>
      <stop offset="82%" stop-color="#041e19"/>
      <stop offset="100%" stop-color="#010b09"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes r1 { from{transform:rotate(0deg);}   to{transform:rotate(360deg);} }
    @keyframes r2 { from{transform:rotate(0deg);}   to{transform:rotate(-360deg);} }
    @keyframes r3 { from{transform:rotate(30deg);}  to{transform:rotate(390deg);} }
    @keyframes ip { 0%,100%{transform:scale(1);}    50%{transform:scale(1.035);} }
    @keyframes dp { 0%,100%{opacity:1;}             50%{opacity:0.2;} }
    .fm { font-family:'Share Tech Mono','Courier New',monospace; }
  </style>

  <rect width="960" height="80" fill="url(#bg)"/>
  <line x1="0" y1="0.5" x2="960" y2="0.5" stroke="#2fe6cf" stroke-width="0.5" opacity="0.22"/>
  <line x1="0" y1="79" x2="960" y2="79" stroke="#2fe6cf" stroke-width="0.5" opacity="0.22"/>

  <!-- Arc reactor (left side) -->
  <g transform="translate(52,40)">
    <g style="animation:r1 14s linear infinite;transform-origin:0 0;">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#2fe6cf" stroke-width="0.8" stroke-dasharray="5 8" opacity="0.55"/>
      <rect x="-1" y="-32" width="2" height="5" rx="1" fill="#2fe6cf" opacity="0.8"/>
      <rect x="-1" y="27"  width="2" height="5" rx="1" fill="#2fe6cf" opacity="0.8"/>
      <rect x="-32" y="-1" width="5" height="2" rx="1" fill="#2fe6cf" opacity="0.8"/>
      <rect x="27"  y="-1" width="5" height="2" rx="1" fill="#2fe6cf" opacity="0.8"/>
    </g>
    <g style="animation:r2 9s linear infinite;transform-origin:0 0;">
      <circle cx="0" cy="0" r="23" fill="none" stroke="#ffb347" stroke-width="1.2" stroke-dasharray="12 8" opacity="0.65"/>
    </g>
    <g style="animation:r3 5s linear infinite;transform-origin:0 0;">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#ff4d4d" stroke-width="1.8" stroke-dasharray="10 5" opacity="0.7"/>
    </g>
    <circle cx="0" cy="0" r="10" fill="url(#orbG)"
            style="filter:drop-shadow(0 0 8px #2fe6cf55);animation:ip 1.5s ease-in-out infinite;transform-origin:0 0;"/>
    <polygon points="0,-6 -5,4 5,4" fill="none" stroke="#2fe6cf" stroke-width="1.2" opacity="0.9"/>
  </g>

  <!-- Vertical divider -->
  <line x1="96" y1="8" x2="96" y2="72" stroke="#2fe6cf" stroke-width="0.4" opacity="0.22"/>

  <!-- Label -->
  <text x="108" y="26" class="fm" font-size="9" fill="#5fa89c" letter-spacing="2">ARC REACTOR // CORE TELEMETRY</text>
  <line x1="108" y1="32" x2="680" y2="32" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <!-- Stats row -->
  <text x="108" y="48" class="fm" font-size="8" fill="#5fa89c" letter-spacing="1">COMMITS</text>
  <text x="108" y="62" class="fm" font-size="14" fill="#dffbf6"
        style="filter:drop-shadow(0 0 8px #2fe6cf55);">314+</text>

  <line x1="210" y1="36" x2="210" y2="70" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="222" y="48" class="fm" font-size="8" fill="#5fa89c" letter-spacing="1">REPOS</text>
  <text x="222" y="62" class="fm" font-size="14" fill="#dffbf6"
        style="filter:drop-shadow(0 0 8px #2fe6cf55);">12</text>

  <line x1="286" y1="36" x2="286" y2="70" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="298" y="48" class="fm" font-size="8" fill="#5fa89c" letter-spacing="1">STREAK</text>
  <text x="298" y="62" class="fm" font-size="14" fill="#00ff88"
        style="filter:drop-shadow(0 0 8px rgba(0,255,136,0.3));">12d</text>

  <line x1="370" y1="36" x2="370" y2="70" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="382" y="48" class="fm" font-size="8" fill="#5fa89c" letter-spacing="1">ARC ENERGY</text>
  <text x="382" y="62" class="fm" font-size="14" fill="#ffb347"
        style="filter:drop-shadow(0 0 8px rgba(255,179,71,0.3));">3.0 TW</text>

  <line x1="480" y1="36" x2="480" y2="70" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="492" y="48" class="fm" font-size="8" fill="#5fa89c" letter-spacing="1">STARS</text>
  <text x="492" y="62" class="fm" font-size="14" fill="#2fe6cf">★ ∞</text>

  <line x1="556" y1="36" x2="556" y2="70" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="568" y="48" class="fm" font-size="8" fill="#5fa89c" letter-spacing="1">LANGUAGES</text>
  <text x="568" y="62" class="fm" font-size="10" fill="#2fe6cf">JS · TS · PY · JAVA · C</text>

  <line x1="716" y1="36" x2="716" y2="70" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <!-- Right status -->
  <text x="728" y="40" class="fm" font-size="8" fill="#5fa89c" letter-spacing="1">SYSTEM STATUS</text>
  <circle cx="850" cy="50" r="4" fill="#00ff88"
          style="filter:drop-shadow(0 0 8px #00ff88);animation:dp 2s ease-in-out infinite;"/>
  <text x="728" y="58" class="fm" font-size="9" fill="#00ff88">ALL SYSTEMS NOMINAL</text>
  <text x="728" y="70" class="fm" font-size="8" fill="#5fa89c">UPTIME: 99.97%</text>
</svg>
