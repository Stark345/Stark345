<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 60" width="100%" height="60">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#06201c"/>
      <stop offset="100%" stop-color="#020705"/>
    </radialGradient>
    <radialGradient id="orbG" cx="40%" cy="34%" r="65%">
      <stop offset="0%"  stop-color="#bdfff2"/>
      <stop offset="26%" stop-color="#29c9ad"/>
      <stop offset="58%" stop-color="#0d5e51"/>
      <stop offset="100%" stop-color="#010b09"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.5" fill="#2fe6cf" opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    @keyframes r1 { from{transform:rotate(0deg);}  to{transform:rotate(360deg);} }
    @keyframes r2 { from{transform:rotate(0deg);}  to{transform:rotate(-360deg);} }
    @keyframes ip { 0%,100%{transform:scale(1);}   50%{transform:scale(1.04);} }
    @keyframes dp { 0%,100%{opacity:1;}            50%{opacity:0.2;} }
    .fm { font-family:'Share Tech Mono','Courier New',monospace; }
  </style>

  <rect width="960" height="60" fill="url(#bg)"/>
  <rect width="960" height="60" fill="url(#dots)"/>
  <line x1="0" y1="0.5" x2="960" y2="0.5" stroke="#2fe6cf" stroke-width="0.4" opacity="0.22"/>
  <line x1="0" y1="59" x2="960" y2="59" stroke="#2fe6cf" stroke-width="0.4" opacity="0.22"/>

  <!-- Left label -->
  <text x="14" y="18" class="fm" font-size="8" fill="#5fa89c" letter-spacing="2">GITHUB.TELEMETRY</text>
  <line x1="14" y1="23" x2="140" y2="23" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <!-- Mini arc reactor -->
  <g transform="translate(32,42)">
    <g style="animation:r1 10s linear infinite;transform-origin:0 0;">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#2fe6cf" stroke-width="0.7"
              stroke-dasharray="3 5" opacity="0.55"/>
    </g>
    <g style="animation:r2 6s linear infinite;transform-origin:0 0;">
      <circle cx="0" cy="0" r="9" fill="none" stroke="#ffb347" stroke-width="1"
              stroke-dasharray="6 4" opacity="0.6"/>
    </g>
    <circle cx="0" cy="0" r="5" fill="url(#orbG)"
            style="filter:drop-shadow(0 0 5px rgba(47,230,207,0.5));animation:ip 1.5s ease-in-out infinite;transform-origin:0 0;"/>
    <polygon points="0,-3 -2.5,2 2.5,2" fill="none" stroke="#2fe6cf" stroke-width="0.8" opacity="0.9"/>
  </g>

  <line x1="58" y1="10" x2="58" y2="55" stroke="#2fe6cf" stroke-width="0.3" opacity="0.22"/>

  <!-- Stats: Commits -->
  <text x="68" y="28" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">COMMITS</text>
  <text x="68" y="48" class="fm" font-size="18" fill="#dffbf6"
        style="filter:drop-shadow(0 0 6px rgba(47,230,207,0.3));">314+</text>

  <line x1="148" y1="10" x2="148" y2="55" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="158" y="28" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">REPOS</text>
  <text x="158" y="48" class="fm" font-size="18" fill="#dffbf6">12</text>

  <line x1="210" y1="10" x2="210" y2="55" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="220" y="28" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">STREAK</text>
  <text x="220" y="48" class="fm" font-size="18" fill="#00ff88"
        style="filter:drop-shadow(0 0 6px rgba(0,255,136,0.3));">12d</text>

  <line x1="280" y1="10" x2="280" y2="55" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="290" y="28" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">CONTRIBUTIONS</text>
  <text x="290" y="48" class="fm" font-size="18" fill="#2fe6cf">314</text>

  <line x1="380" y1="10" x2="380" y2="55" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="390" y="28" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">LANGUAGES</text>
  <text x="390" y="45" class="fm" font-size="10" fill="#2fe6cf">JS · TS · PY · JAVA · C</text>

  <line x1="560" y1="10" x2="560" y2="55" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="570" y="28" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">SYSTEM STATUS</text>
  <circle cx="630" cy="40" r="4" fill="#00ff88"
          style="filter:drop-shadow(0 0 8px #00ff88);animation:dp 2s ease-in-out infinite;"/>
  <text x="638" y="44" class="fm" font-size="10" fill="#00ff88">ALL SYSTEMS NOMINAL</text>

  <line x1="810" y1="10" x2="810" y2="55" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>

  <text x="820" y="28" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">LOCATION</text>
  <text x="820" y="44" class="fm" font-size="9" fill="#5fa89c">13.08°N / 80.27°E</text>
</svg>
