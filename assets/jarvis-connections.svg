<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 80" width="100%" height="80">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#06201c"/>
      <stop offset="100%" stop-color="#020705"/>
    </radialGradient>
    <radialGradient id="orbG" cx="40%" cy="34%" r="65%">
      <stop offset="0%"  stop-color="#bdfff2"/>
      <stop offset="26%" stop-color="#29c9ad"/>
      <stop offset="58%" stop-color="#0d5e51"/>
      <stop offset="100%" stop-color="#010b09"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.5" fill="#2fe6cf" opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    @keyframes r1 { from{transform:rotate(0deg);}   to{transform:rotate(360deg);} }
    @keyframes r2 { from{transform:rotate(0deg);}   to{transform:rotate(-360deg);} }
    @keyframes ip { 0%,100%{transform:scale(1);}    50%{transform:scale(1.04);} }
    @keyframes dp { 0%,100%{opacity:1;}             50%{opacity:0.2;} }
    @keyframes btnGlow {
      0%,100%{ filter:drop-shadow(0 0 2px rgba(47,230,207,0.3)); }
      50%     { filter:drop-shadow(0 0 8px rgba(47,230,207,0.6)); }
    }
    .fm { font-family:'Share Tech Mono','Courier New',monospace; }
  </style>

  <rect width="960" height="80" fill="url(#bg)"/>
  <rect width="960" height="80" fill="url(#dots)"/>
  <line x1="0" y1="0.5" x2="960" y2="0.5" stroke="#2fe6cf" stroke-width="0.4" opacity="0.22"/>
  <line x1="0" y1="79" x2="960" y2="79" stroke="#2fe6cf" stroke-width="0.4" opacity="0.22"/>

  <!-- Section label -->
  <text x="14" y="16" class="fm" font-size="8" fill="#5fa89c" letter-spacing="2">SYSTEM.CONNECTIONS</text>

  <!-- Tiny reactor -->
  <g transform="translate(26,50)">
    <g style="animation:r1 10s linear infinite;transform-origin:0 0;">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#2fe6cf" stroke-width="0.7" stroke-dasharray="3 5" opacity="0.55"/>
    </g>
    <g style="animation:r2 6s linear infinite;transform-origin:0 0;">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#ffb347" stroke-width="1.0" stroke-dasharray="6 4" opacity="0.6"/>
    </g>
    <circle cx="0" cy="0" r="5.5" fill="url(#orbG)"
            style="filter:drop-shadow(0 0 6px rgba(47,230,207,0.5));animation:ip 1.5s ease-in-out infinite;transform-origin:0 0;"/>
    <polygon points="0,-3.5 -3,2.5 3,2.5" fill="none" stroke="#2fe6cf" stroke-width="0.9" opacity="0.9"/>
  </g>

  <line x1="56" y1="8" x2="56" y2="72" stroke="#2fe6cf" stroke-width="0.3" opacity="0.22"/>

  <!-- PORTFOLIO -->
  <a href="https://sjaichandran-portfolio.netlify.app/" target="_blank">
    <g style="animation:btnGlow 3.5s ease-in-out infinite;">
      <rect x="66" y="22" width="134" height="36" rx="6" fill="#061a18"
            stroke="#2fe6cf" stroke-width="0.8" stroke-opacity="0.55"/>
      <polyline points="66,32 66,22 76,22" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
      <polyline points="190,22 200,22 200,32" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
      <text x="133" y="37" text-anchor="middle" class="fm" font-size="7" fill="#5fa89c" letter-spacing="2">PORTFOLIO</text>
      <text x="133" y="50" text-anchor="middle" class="fm" font-size="8.5" fill="#2fe6cf">OPEN LINK ↗</text>
    </g>
  </a>

  <!-- EMAIL -->
  <a href="mailto:jaichandran20871@gmail.com">
    <g style="animation:btnGlow 3.5s ease-in-out 0.6s infinite;">
      <rect x="212" y="22" width="208" height="36" rx="6" fill="#061a18"
            stroke="#2fe6cf" stroke-width="0.8" stroke-opacity="0.55"/>
      <polyline points="212,32 212,22 222,22" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
      <polyline points="410,22 420,22 420,32" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
      <text x="316" y="37" text-anchor="middle" class="fm" font-size="7" fill="#5fa89c" letter-spacing="2">EMAIL</text>
      <text x="316" y="50" text-anchor="middle" class="fm" font-size="8.5" fill="#2fe6cf">jaichandran20871@gmail.com</text>
    </g>
  </a>

  <!-- GITHUB -->
  <a href="https://github.com/Stark345" target="_blank">
    <g style="animation:btnGlow 3.5s ease-in-out 1.2s infinite;">
      <rect x="432" y="22" width="156" height="36" rx="6" fill="#061a18"
            stroke="#2fe6cf" stroke-width="0.8" stroke-opacity="0.55"/>
      <polyline points="432,32 432,22 442,22" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
      <polyline points="578,22 588,22 588,32" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
      <text x="510" y="37" text-anchor="middle" class="fm" font-size="7" fill="#5fa89c" letter-spacing="2">GITHUB</text>
      <text x="510" y="50" text-anchor="middle" class="fm" font-size="8.5" fill="#2fe6cf">Stark345 ↗</text>
    </g>
  </a>

  <!-- LINKEDIN -->
  <a href="https://www.linkedin.com/in/jaichandran-s-139a8b354" target="_blank">
    <g style="animation:btnGlow 3.5s ease-in-out 1.8s infinite;">
      <rect x="600" y="22" width="154" height="36" rx="6" fill="#061a18"
            stroke="#2fe6cf" stroke-width="0.8" stroke-opacity="0.55"/>
      <polyline points="600,32 600,22 610,22" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
      <polyline points="744,22 754,22 754,32" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
      <text x="677" y="37" text-anchor="middle" class="fm" font-size="7" fill="#5fa89c" letter-spacing="2">LINKEDIN</text>
      <text x="677" y="50" text-anchor="middle" class="fm" font-size="8.5" fill="#2fe6cf">jaichandran-s ↗</text>
    </g>
  </a>

  <!-- Status + footer -->
  <circle cx="795" cy="40" r="4" fill="#00ff88"
          style="filter:drop-shadow(0 0 8px #00ff88);animation:dp 1.8s ease-in-out infinite;"/>
  <text x="803" y="36" class="fm" font-size="7" fill="#5fa89c">SYSTEM</text>
  <text x="803" y="47" class="fm" font-size="9" fill="#00ff88">ONLINE</text>

  <line x1="850" y1="8" x2="850" y2="72" stroke="#2fe6cf" stroke-width="0.3" opacity="0.18"/>
  <text x="862" y="36" class="fm" font-size="6.5" fill="#5fa89c">STARK CORE</text>
  <text x="862" y="50" class="fm" font-size="6.5" fill="#5fa89c">JARVIS SYSTEM</text>
</svg>
