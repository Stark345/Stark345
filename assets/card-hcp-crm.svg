<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 190" width="100%" height="100%">
  <defs>
    <linearGradient id="crmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="crmBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="446" height="186" rx="10" fill="url(#crmBg)" stroke="url(#crmBorder)" stroke-width="1.2"/>

  <!-- Top Status Badge -->
  <g transform="translate(18, 18)">
    <rect x="0" y="0" width="112" height="18" rx="4" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-width="0.7"/>
    <circle cx="8" cy="9" r="3" fill="#38BDF8"/>
    <text x="16" y="12.5" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38BDF8" letter-spacing="1">AGENTIC CRM // V1</text>
  </g>

  <text x="390" y="32" font-size="16">🏥</text>

  <!-- Title -->
  <text x="18" y="60" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#F8FAFC">
    AI-Powered HCP CRM Platform
  </text>

  <!-- Description -->
  <text x="18" y="82" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">
    Autonomous Healthcare Professional engagement platform with
  </text>
  <text x="18" y="98" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94A3B8">
    conversational LLM agents, intelligent scheduling &amp; tool-calling.
  </text>

  <!-- Tech Badges -->
  <g transform="translate(18, 118)">
    <!-- React -->
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="30" y="13.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">React.js</text>

    <!-- Node -->
    <rect x="66" y="0" width="68" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="100" y="13.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">Node/Express</text>

    <!-- LLM Agent -->
    <rect x="140" y="0" width="86" height="20" rx="4" fill="#312E81" stroke="#6366F1" stroke-width="0.8"/>
    <text x="183" y="13.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#C7D2FE">LLM Agents</text>

    <!-- SQLite -->
    <rect x="232" y="0" width="56" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="260" y="13.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">SQLite</text>

    <!-- RAG -->
    <rect x="294" y="0" width="50" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="319" y="13.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FBBF24">RAG</text>
  </g>

  <!-- Footer Info Line -->
  <line x1="18" y1="154" x2="432" y2="154" stroke="#1E293B" stroke-width="1"/>
  <g transform="translate(18, 172)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">METRIC: </text>
    <text x="50" y="0" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#10B981">Multi-Turn Tool Calling Pipeline</text>
    <text x="330" y="0" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#38BDF8">View Repo →</text>
  </g>
</svg>
