<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 140" width="100%" height="100%">
  <defs>
    <linearGradient id="monBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes graphPulse {
      0%, 100% { opacity: 0.7; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.15); }
    }
    @keyframes sweepLine {
      0% { transform: translateX(0); }
      100% { transform: translateX(380px); }
    }
    .bar-pulse {
      transform-origin: bottom;
      animation: graphPulse 2.5s ease-in-out infinite;
    }
    .scanner-radar {
      animation: sweepLine 3s linear infinite;
    }
  </style>

  <rect x="2" y="2" width="946" height="136" rx="10" fill="url(#monBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Top Title -->
  <g transform="translate(24, 18)">
    <circle cx="4" cy="4" r="3" fill="#10B981"/>
    <text x="16" y="8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1.5">
      GITHUB.ACTIVITY // LIVE SYSTEM DIAGNOSTICS &amp; TELEMETRY
    </text>
    <text x="740" y="8" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748B">SAMPLING: REAL-TIME</text>
  </g>

  <line x1="20" y1="32" x2="930" y2="32" stroke="#1E293B" stroke-width="1"/>

  <!-- 4 Metrics Gauges -->
  <!-- Metric 1: Uptime -->
  <g transform="translate(36, 48)">
    <rect x="0" y="0" width="180" height="74" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="0.8"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">UPTIME / STABILITY</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#34D399">99.98%</text>
    <text x="14" y="64" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8">SYSTEM ONLINE</text>
  </g>

  <!-- Metric 2: Code Quality -->
  <g transform="translate(230, 48)">
    <rect x="0" y="0" width="180" height="74" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="0.8"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">SECURITY RATING</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#38BDF8">GRADE A+</text>
    <text x="14" y="64" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10B981">ZERO SECRETS / AUDITED</text>
  </g>

  <!-- Metric 3: AI Pipeline Latency -->
  <g transform="translate(424, 48)">
    <rect x="0" y="0" width="180" height="74" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="0.8"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">AGENTIC THROUGHPUT</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#A855F7">&lt;140ms</text>
    <text x="14" y="64" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C084FC">STREAMING RAG</text>
  </g>

  <!-- Metric 4: Animated Activity Waveform -->
  <g transform="translate(618, 48)">
    <rect x="0" y="0" width="296" height="74" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="0.8"/>
    <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">NEURAL PULSE ACTIVITY</text>

    <!-- Mini animated spectrum bars -->
    <g transform="translate(14, 32)">
      <rect x="0" y="16" width="6" height="20" rx="2" fill="#38BDF8" class="bar-pulse"/>
      <rect x="10" y="10" width="6" height="26" rx="2" fill="#38BDF8" class="bar-pulse"/>
      <rect x="20" y="6" width="6" height="30" rx="2" fill="#818CF8" class="bar-pulse"/>
      <rect x="30" y="14" width="6" height="22" rx="2" fill="#818CF8" class="bar-pulse"/>
      <rect x="40" y="2" width="6" height="34" rx="2" fill="#A855F7" class="bar-pulse"/>
      <rect x="50" y="12" width="6" height="24" rx="2" fill="#A855F7" class="bar-pulse"/>
      <rect x="60" y="8" width="6" height="28" rx="2" fill="#34D399" class="bar-pulse"/>
      <rect x="70" y="18" width="6" height="18" rx="2" fill="#34D399" class="bar-pulse"/>
      <rect x="80" y="4" width="6" height="32" rx="2" fill="#38BDF8" class="bar-pulse"/>
      <rect x="90" y="14" width="6" height="22" rx="2" fill="#38BDF8" class="bar-pulse"/>
      <rect x="100" y="8" width="6" height="28" rx="2" fill="#60A5FA" class="bar-pulse"/>
      <rect x="110" y="16" width="6" height="20" rx="2" fill="#60A5FA" class="bar-pulse"/>
      <rect x="120" y="2" width="6" height="34" rx="2" fill="#A855F7" class="bar-pulse"/>
      <rect x="130" y="10" width="6" height="26" rx="2" fill="#A855F7" class="bar-pulse"/>
      <rect x="140" y="6" width="6" height="30" rx="2" fill="#34D399" class="bar-pulse"/>
      <rect x="150" y="18" width="6" height="18" rx="2" fill="#34D399" class="bar-pulse"/>
      <rect x="160" y="12" width="6" height="24" rx="2" fill="#38BDF8" class="bar-pulse"/>
      <rect x="170" y="4" width="6" height="32" rx="2" fill="#38BDF8" class="bar-pulse"/>
      <rect x="180" y="14" width="6" height="22" rx="2" fill="#818CF8" class="bar-pulse"/>
      <rect x="190" y="8" width="6" height="28" rx="2" fill="#818CF8" class="bar-pulse"/>
      <rect x="200" y="20" width="6" height="16" rx="2" fill="#C084FC" class="bar-pulse"/>
      <rect x="210" y="6" width="6" height="30" rx="2" fill="#C084FC" class="bar-pulse"/>
      <rect x="220" y="12" width="6" height="24" rx="2" fill="#34D399" class="bar-pulse"/>
      <rect x="230" y="16" width="6" height="20" rx="2" fill="#34D399" class="bar-pulse"/>
      <rect x="240" y="8" width="6" height="28" rx="2" fill="#38BDF8" class="bar-pulse"/>
      <rect x="250" y="4" width="6" height="32" rx="2" fill="#38BDF8" class="bar-pulse"/>
      <rect x="260" y="14" width="6" height="22" rx="2" fill="#60A5FA" class="bar-pulse"/>
    </g>
  </g>
</svg>
