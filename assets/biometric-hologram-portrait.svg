<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 340 380" width="100%" height="100%">
  <defs>
    <!-- Dark Background -->
    <linearGradient id="bioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01070A"/>
      <stop offset="100%" stop-color="#020E13"/>
    </linearGradient>

    <!-- Holographic Beam Glow -->
    <filter id="hologramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="portraitClip">
      <rect x="20" y="20" width="300" height="340" rx="6"/>
    </clipPath>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { transform: translateY(20px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(350px); opacity: 0; }
    }
    @keyframes pulseTarget {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #00FFCC); }
    }
    .scanner-beam {
      animation: laserSweep 3.5s ease-in-out infinite;
    }
    .hud-reticle {
      animation: pulseTarget 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="336" height="376" rx="8" fill="url(#bioBg)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.35"/>

  <!-- High-Resolution Crystal Clear Photograph -->
  <g clip-path="url(#portraitClip)">
    <image href="github_profile.jpg" x="20" y="20" width="300" height="340" preserveAspectRatio="xMidYMid slice"/>
    
    <!-- Subtle Cyan Holographic Tint Overlay -->
    <rect x="20" y="20" width="300" height="340" fill="#00E5FF" fill-opacity="0.08"/>

    <!-- Subtle Hologram Tech Scanlines -->
    <line x1="20" y1="0" x2="320" y2="0" stroke="#00FFCC" stroke-width="2" class="scanner-beam" filter="url(#hologramGlow)"/>
    <line x1="20" y1="-2" x2="320" y2="-2" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4" class="scanner-beam"/>
  </g>

  <!-- Cybernetic HUD Framing (Matching Image 5 & 8) -->
  <g class="hud-reticle">
    <!-- Top-Left Bracket -->
    <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00FFCC" stroke-width="2"/>
    <!-- Top-Right Bracket -->
    <path d="M 328 36 L 328 12 L 304 12" fill="none" stroke="#00FFCC" stroke-width="2"/>
    <!-- Bottom-Left Bracket -->
    <path d="M 12 344 L 12 368 L 36 368" fill="none" stroke="#00FFCC" stroke-width="2"/>
    <!-- Bottom-Right Bracket -->
    <path d="M 328 344 L 328 368 L 304 368" fill="none" stroke="#00FFCC" stroke-width="2"/>

    <!-- Biometric Face Target Reticle Points -->
    <circle cx="170" cy="150" r="28" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-dasharray="3 3"/>
    <circle cx="170" cy="150" r="4" fill="none" stroke="#00FFCC" stroke-width="1"/>
    <circle cx="170" cy="150" r="1.5" fill="#00FFCC"/>
    
    <!-- Reticle Ticks -->
    <line x1="170" y1="114" x2="170" y2="120" stroke="#00FFCC" stroke-width="1.5"/>
    <line x1="170" y1="180" x2="170" y2="186" stroke="#00FFCC" stroke-width="1.5"/>
    <line x1="134" y1="150" x2="140" y2="150" stroke="#00FFCC" stroke-width="1.5"/>
    <line x1="200" y1="150" x2="206" y2="150" stroke="#00FFCC" stroke-width="1.5"/>
  </g>

  <!-- Top HUD Status Header -->
  <rect x="30" y="6" width="280" height="18" rx="3" fill="#010A0D" stroke="#00E5FF" stroke-width="0.7"/>
  <text x="170" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#00FFCC" letter-spacing="1">
    VISUAL.MAP // S. JAICHANDRAN
  </text>

  <!-- Bottom Coordinate Tag -->
  <rect x="20" y="348" width="300" height="18" rx="3" fill="#010A0D" fill-opacity="0.9" stroke="#0E2A47" stroke-width="0.7"/>
  <text x="170" y="361" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8" letter-spacing="0.5">
    LAT: 13.0827°N // LNG: 80.2707°E [BIOMETRIC_OK]
  </text>
</svg>
