  <text x="28" y="19" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1">SYSTEM.INFO // IDENTITY_SPEC</text>
  
  <rect x="390" y="6" width="138" height="18" rx="4" fill="#022C43" stroke="#00F0FF" stroke-width="0.7"/>
