<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%">
  <defs>
    <linearGradient id="jarvisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="100%" stop-color="#071026"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulseCyan { 0%, 100% { fill: #00F0FF; } 50% { fill: #38BDF8; filter: drop-shadow(0 0 4px #00F0FF); } }
    .cursor-box { animation: blinkCursor 0.9s infinite; }
    .status-dot { animation: pulseCyan 2s infinite; }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="536" height="356" rx="8" fill="url(#jarvisBg)" stroke="#0E2A47" stroke-width="1.2"/>

