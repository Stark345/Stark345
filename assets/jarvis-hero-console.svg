<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="auto">
  <defs>
    <!-- Background: exact JARVIS palette -->
    <radialGradient id="bgGrad" cx="30%" cy="48%" r="65%">
      <stop offset="0%"   stop-color="#06201c"/>
      <stop offset="45%"  stop-color="#030f0d"/>
      <stop offset="100%" stop-color="#020705"/>
    </radialGradient>

    <!-- Glass panel background -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#061a18" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#030e0c" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Orb gradient: exact from style.css .orb -->
    <radialGradient id="orbGrad" cx="40%" cy="34%" r="65%">
      <stop offset="0%"   stop-color="#bdfff2"/>
      <stop offset="26%"  stop-color="#29c9ad"/>
      <stop offset="58%"  stop-color="#0d5e51"/>
      <stop offset="82%"  stop-color="#041e19"/>
      <stop offset="100%" stop-color="#010b09"/>
    </radialGradient>
    <radialGradient id="orbShine" cx="38%" cy="32%" r="22%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot grid pattern from style.css -->
    <pattern id="dotGrid" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.5" fill="#2fe6cf" opacity="0.045"/>
    </pattern>
  </defs>

  <style>
    @keyframes idlePulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.035); }
    }
    @keyframes ringASpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes ringBSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }
    @keyframes flowerSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes rippleWave {
      0%   { r: 42; opacity: 0.55; }
      100% { r: 96; opacity: 0; }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }
    @keyframes floatY {
      0%, 100% { transform: translate(360px, 46px); }
      50%      { transform: translate(360px, 43px); }
    }
    @keyframes scanLine {
      0%   { transform: translateY(0); opacity: 0.2; }
      50%  { opacity: 0.5; }
      100% { transform: translateY(420px); opacity: 0.2; }
    }
    .fm { font-family: 'Share Tech Mono', 'Courier New', monospace; }
  </style>

  <!-- ═══ MASTER BACKGROUND ═══ -->
  <rect width="600" height="420" fill="url(#bgGrad)"/>
  <rect width="600" height="420" fill="url(#dotGrid)"/>
  <rect x="0" y="0" width="600" height="1.5" fill="#2fe6cf" opacity="0.08" style="animation: scanLine 6s linear infinite;"/>

  <!-- ═══ TOP INTEGRATED TITLE BAR ═══ -->
  <rect x="0" y="0" width="600" height="32" fill="#061a18" opacity="0.6"/>
  <line x1="0" y1="31.5" x2="600" y2="31.5" stroke="#2fe6cf" stroke-width="0.5" opacity="0.22"/>
  
  <!-- Mini reactor icon -->
  <circle cx="20" cy="16" r="6" fill="none" stroke="#2fe6cf" stroke-width="1.2" opacity="0.75"/>
  <circle cx="20" cy="16" r="2" fill="#2fe6cf"/>
  
  <text x="32" y="19.5" class="fm" font-size="9" fill="#5fa89c" letter-spacing="2">J.A.R.V.I.S.</text>
  <text x="124" y="19.5" class="fm" font-size="8" fill="#2fe6cf" letter-spacing="1.5">// SYSTEM ONLINE</text>
  
  <text x="340" y="19.5" text-anchor="middle" class="fm" font-size="8" fill="#5fa89c" letter-spacing="0.5">jaichandran20871@gmail.com</text>
  
  <!-- Window controls -->
  <circle cx="525" cy="16" r="3" fill="#00ff88" style="animation: dotPulse 2s ease-in-out infinite;"/>
  <line x1="540" y1="16" x2="550" y2="16" stroke="#5fa89c" stroke-width="1.5"/>
  <rect x="558" y="11" width="9" height="9" rx="1" fill="none" stroke="#5fa89c" stroke-width="1.5"/>
  <line x1="574" y1="11" x2="583" y2="20" stroke="#5fa89c" stroke-width="1.5"/>
  <line x1="583" y1="11" x2="574" y2="20" stroke="#5fa89c" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════
       CENTER REGION: AUTHENTIC J.A.R.V.I.S. CORE
       Positioned at CX=170, CY=185
       ═══════════════════════════════════════════════════ -->
  <g transform="translate(170, 182)">
    <!-- Ambient glowing halo -->
    <circle cx="0" cy="0" r="115" fill="#2fe6cf" opacity="0.02"/>
    <circle cx="0" cy="0" r="90"  fill="#2fe6cf" opacity="0.025"/>

    <!-- Outer Organic Particle Ring B (Counter-Clockwise) -->
    <g style="animation: ringBSpin 26s linear infinite; transform-origin: 0 0;">
      <circle cx="0" cy="0" r="102" fill="none" stroke="#2fe6cf" stroke-width="1.0" stroke-dasharray="2 3.5" opacity="0.45"/>
      <circle cx="0"    cy="-102" r="1.5" fill="#2fe6cf" opacity="0.8"/>
      <circle cx="102"  cy="0"    r="1.5" fill="#2fe6cf" opacity="0.8"/>
      <circle cx="0"    cy="102"  r="1.5" fill="#2fe6cf" opacity="0.8"/>
      <circle cx="-102" cy="0"    r="1.5" fill="#2fe6cf" opacity="0.8"/>
      <!-- Iron Man gold cardinal ticks -->
      <line x1="0"    y1="-98"  x2="0"    y2="-107" stroke="#ffb347" stroke-width="2" opacity="0.8"/>
      <line x1="0"    y1="98"   x2="0"    y2="107"  stroke="#ffb347" stroke-width="2" opacity="0.8"/>
      <line x1="-98"  y1="0"    x2="-107" y2="0"    stroke="#ffb347" stroke-width="2" opacity="0.8"/>
      <line x1="98"   y1="0"    x2="107"  y2="0"    stroke="#ffb347" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Inner Organic Particle Ring A (Clockwise) -->
    <g style="animation: ringASpin 18s linear infinite; transform-origin: 0 0;">
      <circle cx="0" cy="0" r="82" fill="none" stroke="#2fe6cf" stroke-width="0.9" stroke-dasharray="1.5 2.5" opacity="0.38"/>
      <circle cx="0"   cy="-82" r="1.8" fill="#2fe6cf" opacity="0.6"/>
      <circle cx="82"  cy="0"   r="1.8" fill="#2fe6cf" opacity="0.6"/>
      <circle cx="0"   cy="82"  r="1.8" fill="#2fe6cf" opacity="0.6"/>
      <circle cx="-82" cy="0"   r="1.8" fill="#2fe6cf" opacity="0.6"/>
      <!-- Iron Man crimson armor accent ring -->
      <circle cx="0" cy="0" r="68" fill="none" stroke="#ff4d4d" stroke-width="1.6" stroke-dasharray="18 10" opacity="0.65"/>
    </g>

    <!-- 7 Interlocking Flower Petal Rings from index.html -->
    <g style="animation: flowerSpin 55s linear infinite; transform-origin: 0 0; opacity: 0.42;">
      <circle cx="0"     cy="-16" r="16" fill="none" stroke="#bdfff2" stroke-width="0.35"/>
      <circle cx="0"     cy="16"  r="16" fill="none" stroke="#bdfff2" stroke-width="0.35"/>
      <circle cx="-13.8" cy="-8"  r="16" fill="none" stroke="#bdfff2" stroke-width="0.35"/>
      <circle cx="-13.8" cy="8"   r="16" fill="none" stroke="#bdfff2" stroke-width="0.35"/>
      <circle cx="13.8"  cy="-8"  r="16" fill="none" stroke="#bdfff2" stroke-width="0.35"/>
      <circle cx="13.8"  cy="8"   r="16" fill="none" stroke="#bdfff2" stroke-width="0.35"/>
      <circle cx="0"     cy="0"   r="16" fill="none" stroke="#bdfff2" stroke-width="0.35"/>
    </g>

    <!-- Luminous Spherical Orb Core -->
    <circle cx="0" cy="0" r="42" fill="url(#orbGrad)"
            style="filter: drop-shadow(0 0 28px rgba(47,230,207,0.32)); animation: idlePulse 1.6s ease-in-out infinite; transform-origin: 0 0;"/>
    <circle cx="0" cy="0" r="42" fill="url(#orbShine)"/>

    <!-- Expanding Ripple Wave -->
    <circle cx="0" cy="0" fill="none" stroke="#2fe6cf" stroke-width="0.9">
      <animate attributeName="r"       values="42;96"  dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0.55;0" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
    </circle>

    <!-- Floating Energy Triangle inside Orb -->
    <polygon points="0,-16 -14,11 14,11" fill="none" stroke="#2fe6cf" stroke-width="1.4" opacity="0.85"
             style="filter: drop-shadow(0 0 5px rgba(47,230,207,0.7));"/>
  </g>

  <!-- Name & Title Anchor below the Core -->
  <text x="170" y="334" text-anchor="middle" class="fm" font-size="18" fill="#dffbf6"
        letter-spacing="3.5" style="filter: drop-shadow(0 0 8px rgba(47,230,207,0.25)); font-weight: bold;">
    S. JAICHANDRAN
  </text>
  <text x="170" y="352" text-anchor="middle" class="fm" font-size="8.5" fill="#2fe6cf" letter-spacing="2">
    AI-INTEGRATED FULL STACK DEVELOPER
  </text>
  
  <g transform="translate(170, 370)">
    <circle cx="-50" cy="-2.5" r="2.5" fill="#00ff88" style="animation: dotPulse 2s ease-in-out infinite;"/>
    <text x="-42" y="0" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">STARK CORE // ARCHITECTURE ONLINE</text>
  </g>

  <!-- Vertical Hairline Divider between Core and Identity Panel -->
  <line x1="335" y1="46" x2="335" y2="396" stroke="#2fe6cf" stroke-width="0.5" opacity="0.18" stroke-dasharray="4 4"/>

  <!-- ═══════════════════════════════════════════════════
       RIGHT REGION: FLOATING DEVELOPER IDENTITY HUD PANEL
       Properly animated with locked X=360px!
       ═══════════════════════════════════════════════════ -->
  <g style="animation: floatY 6s ease-in-out infinite;">
    <!-- Panel Glass Body -->
    <rect x="0" y="0" width="226" height="356" rx="8" fill="url(#glassGrad)"
          stroke="#2fe6cf" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- Corner Brackets -->
    <polyline points="0,14 0,0 14,0" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
    <polyline points="212,0 226,0 226,14" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
    <polyline points="0,342 0,356 14,356" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>
    <polyline points="212,356 226,356 226,342" fill="none" stroke="#2fe6cf" stroke-width="1.4"/>

    <!-- Header -->
    <text x="14" y="22" class="fm" font-size="8.5" fill="#5fa89c" letter-spacing="2">SYSTEM.INFO // IDENTITY</text>
    <circle cx="210" cy="18" r="3" fill="#2fe6cf" style="filter: drop-shadow(0 0 5px #2fe6cf); animation: dotPulse 1.8s ease-in-out infinite;"/>
    <line x1="0" y1="28" x2="226" y2="28" stroke="#2fe6cf" stroke-width="0.4" opacity="0.2"/>

    <!-- Field 1: SUBJECT -->
    <text x="14" y="46" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">SUBJECT</text>
    <text x="14" y="60" class="fm" font-size="10.5" fill="#dffbf6" font-weight="bold">S. JAICHANDRAN</text>
    <line x1="14" y1="67" x2="212" y2="67" stroke="#2fe6cf" stroke-width="0.25" opacity="0.15"/>

    <!-- Field 2: ROLE -->
    <text x="14" y="83" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">DESIGNATION</text>
    <text x="14" y="96" class="fm" font-size="9" fill="#2fe6cf">AI FULL STACK DEVELOPER</text>
    <line x1="14" y1="103" x2="212" y2="103" stroke="#2fe6cf" stroke-width="0.25" opacity="0.15"/>

    <!-- Field 3: LOCATION -->
    <text x="14" y="119" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">BASE OF OPERATIONS</text>
    <text x="14" y="132" class="fm" font-size="9" fill="#dffbf6">CHENNAI, INDIA</text>
    <line x1="14" y1="139" x2="212" y2="139" stroke="#2fe6cf" stroke-width="0.25" opacity="0.15"/>

    <!-- Field 4: EDUCATION -->
    <text x="14" y="155" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">EDUCATION</text>
    <text x="14" y="168" class="fm" font-size="9" fill="#dffbf6">B.TECH IT (HONOURS)</text>
    <line x1="14" y1="175" x2="212" y2="175" stroke="#2fe6cf" stroke-width="0.25" opacity="0.15"/>

    <!-- Field 5: CORE ARCHITECTURE -->
    <text x="14" y="191" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">CORE DOMAIN</text>
    <text x="14" y="204" class="fm" font-size="8.5" fill="#dffbf6">AI + FULL STACK SYSTEMS</text>
    <line x1="14" y1="211" x2="212" y2="211" stroke="#2fe6cf" stroke-width="0.25" opacity="0.15"/>

    <!-- Field 6: PRIMARY ARSENAL -->
    <text x="14" y="227" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">PRIMARY ARSENAL</text>
    <g transform="translate(14, 234)">
      <rect x="0" y="0" width="56" height="14" rx="2" fill="#061a18" stroke="#2fe6cf" stroke-width="0.4" stroke-opacity="0.35"/>
      <text x="28" y="10" text-anchor="middle" class="fm" font-size="6.5" fill="#2fe6cf">React.js</text>
      <rect x="61" y="0" width="54" height="14" rx="2" fill="#061a18" stroke="#2fe6cf" stroke-width="0.4" stroke-opacity="0.35"/>
      <text x="88" y="10" text-anchor="middle" class="fm" font-size="6.5" fill="#2fe6cf">Next.js</text>
      <rect x="120" y="0" width="54" height="14" rx="2" fill="#061a18" stroke="#2fe6cf" stroke-width="0.4" stroke-opacity="0.35"/>
      <text x="147" y="10" text-anchor="middle" class="fm" font-size="6.5" fill="#2fe6cf">Node.js</text>
    </g>
    <g transform="translate(14, 252)">
      <rect x="0" y="0" width="54" height="14" rx="2" fill="#061a18" stroke="#2fe6cf" stroke-width="0.4" stroke-opacity="0.35"/>
      <text x="27" y="10" text-anchor="middle" class="fm" font-size="6.5" fill="#2fe6cf">Python</text>
      <rect x="59" y="0" width="68" height="14" rx="2" fill="#061a18" stroke="#ffb347" stroke-width="0.4" stroke-opacity="0.45"/>
      <text x="93" y="10" text-anchor="middle" class="fm" font-size="6.5" fill="#ffb347">LLM Agents</text>
      <rect x="132" y="0" width="42" height="14" rx="2" fill="#061a18" stroke="#ffb347" stroke-width="0.4" stroke-opacity="0.45"/>
      <text x="153" y="10" text-anchor="middle" class="fm" font-size="6.5" fill="#ffb347">RAG</text>
    </g>
    <line x1="14" y1="274" x2="212" y2="274" stroke="#2fe6cf" stroke-width="0.25" opacity="0.15"/>

    <!-- Field 7: STATUS (Glowing green) -->
    <text x="14" y="293" class="fm" font-size="7.5" fill="#5fa89c" letter-spacing="1">CURRENT STATUS</text>
    <g transform="translate(14, 302)">
      <circle cx="5" cy="5" r="3.5" fill="#00ff88" style="filter: drop-shadow(0 0 6px #00ff88); animation: dotPulse 2s ease-in-out infinite;"/>
      <text x="15" y="8" class="fm" font-size="8.5" fill="#00ff88" font-weight="bold">AVAILABLE FOR OPPORTUNITIES</text>
    </g>

    <!-- Bottom link badge -->
    <g transform="translate(14, 326)">
      <rect x="0" y="0" width="198" height="18" rx="3" fill="#030e0c" stroke="#2fe6cf" stroke-width="0.4" stroke-opacity="0.25"/>
      <text x="10" y="12" class="fm" font-size="7" fill="#5fa89c">UPLINK //</text>
      <text x="60" y="12" class="fm" font-size="7" fill="#2fe6cf">sjaichandran-portfolio.netlify.app</text>
    </g>
  </g>

  <!-- Bottom boundary hairline -->
  <line x1="0" y1="419.5" x2="600" y2="419.5" stroke="#2fe6cf" stroke-width="0.5" opacity="0.2"/>
</svg>
