<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(260px); opacity: 0; }
    }
    @keyframes pulseCore {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes signalPulse {
      0%, 100% { fill: #10B981; }
      50% { fill: #34D399; filter: drop-shadow(0 0 4px #10B981); }
    }
    .scanner {
      animation: scanline 4.5s ease-in-out infinite;
    }
    .cursor {
      animation: blinkCursor 0.9s infinite;
    }
    .pulse-node {
      animation: signalPulse 2s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 6 14;
      animation: dataStream 6s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="946" height="256" rx="14" fill="url(#bgGrad)" stroke="url(#cyberBorder)" stroke-width="1.5"/>

  <!-- Background Grid -->
  <rect x="4" y="4" width="942" height="252" rx="12" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="130" r="110" fill="#0284C7" fill-opacity="0.07" filter="url(#neonGlow)"/>
  <circle cx="780" cy="120" r="100" fill="#7C3AED" fill-opacity="0.08" filter="url(#neonGlow)"/>

  <!-- Scanning Line -->
  <line x1="6" y1="0" x2="944" y2="0" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" class="scanner" filter="url(#softGlow)"/>

  <!-- Decorative Corner HUD Brackets -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 934 36 L 934 16 L 914 16" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 16 224 L 16 244 L 36 244" fill="none" stroke="#A855F7" stroke-width="2"/>
  <path d="M 934 224 L 934 244 L 914 244" fill="none" stroke="#A855F7" stroke-width="2"/>

  <!-- Top System Header Bar -->
  <g transform="translate(30, 24)">
    <circle cx="6" cy="6" r="4.5" class="pulse-node"/>
    <text x="20" y="9" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1.5">CORE.SYS // NEURAL_INTERFACE_v4.2</text>
    <text x="460" y="9" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" fill="#64748B" letter-spacing="1">LOCATION: ASIA_PACIFIC // UTC+05:30</text>
    <rect x="740" y="-1" width="145" height="18" rx="4" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
    <circle cx="752" cy="8" r="3" fill="#10B981"/>
    <text x="763" y="11.5" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#34D399" letter-spacing="1">READY FOR HIRE</text>
  </g>

  <line x1="30" y1="46" x2="920" y2="46" stroke="#1E293B" stroke-width="1"/>

  <!-- Main Hero Identity -->
  <g transform="translate(50, 75)">
    <!-- Sub-badge -->
    <rect x="0" y="0" width="168" height="20" rx="4" fill="#0369A1" fill-opacity="0.2" stroke="#0284C7" stroke-width="0.8"/>
    <text x="8" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1.2">⚡ FULL STACK + AI ARCHITECT</text>

    <!-- Main Name -->
    <text x="0" y="62" font-family="'Segoe UI', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#F8FAFC" letter-spacing="2">
      S. JAICHANDRAN
    </text>

    <!-- Title Badge Line -->
    <text x="0" y="92" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="800" fill="url(#cyanPurpleGrad)" letter-spacing="2.8">
      AI-INTEGRATED FULL STACK DEVELOPER
    </text>

    <!-- Terminal boot quote -->
    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="540" height="26" rx="5" fill="#0B132B" fill-opacity="0.7" stroke="#1E293B" stroke-width="0.8"/>
      <text x="12" y="17" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#94A3B8">
        <tspan fill="#38BDF8">system@stark</tspan><tspan fill="#64748B">:</tspan><tspan fill="#A855F7">~</tspan><tspan fill="#F8FAFC">$</tspan> npx deploy --agentic-pipelines --scalable-web
      </text>
      <rect x="472" y="7" width="7" height="13" fill="#38BDF8" class="cursor"/>
    </g>
  </g>

  <!-- Right Side Cybernetic Telemetry Panel -->
  <g transform="translate(640, 68)">
    <rect x="0" y="0" width="265" height="160" rx="8" fill="#0B132B" fill-opacity="0.6" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Header of mini-panel -->
    <rect x="0" y="0" width="265" height="26" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
    <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="1">TELEMETRY // LIVE VECTORS</text>
    <circle cx="245" cy="13" r="3.5" fill="#38BDF8" class="pulse-node"/>

    <!-- Metrics rows -->
    <g transform="translate(14, 46)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">ARCHITECTURE</text>
      <text x="130" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F1F5F9">MERN + LLM AGENTS</text>

      <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">LANGUAGES</text>
      <text x="130" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F1F5F9">TS • PY • JS • JAVA</text>

      <text x="0" y="48" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">SPECIALIZATION</text>
      <text x="130" y="48" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38BDF8">RAG &amp; TOOL CALLING</text>

      <text x="0" y="72" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">DEGREE</text>
      <text x="130" y="72" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#A855F7">B.TECH IT (HONORS)</text>

      <text x="0" y="96" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">SECURITY / CI</text>
      <text x="130" y="96" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#10B981">HARDENED / AUDITED</text>
    </g>
  </g>

  <!-- Bottom Accent Circuit Line -->
  <path d="M 40 248 L 300 248 L 320 240 L 620 240 L 640 248 L 910 248" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <path d="M 320 240 L 620 240" fill="none" stroke="url(#cyanPurpleGrad)" stroke-width="1.5" class="stream-line"/>
</svg>
