<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 160" width="100%" height="100%">
  <defs>
    <linearGradient id="teleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="100%" stop-color="#071126"/>
    </linearGradient>

    <!-- Glowing Arc Reactor Filter -->
    <filter id="arcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinArc {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #00F0FF); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 10px #38BDF8); }
    }
    .arc-spin {
      transform-origin: 475px 80px;
      animation: spinArc 12s linear infinite;
    }
    .arc-spin-rev {
      transform-origin: 475px 80px;
      animation: spinCounter 8s linear infinite;
    }
    .arc-core {
      transform-origin: 475px 80px;
      animation: pulseHeart 2s ease-in-out infinite;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="946" height="156" rx="10" fill="url(#teleBg)" stroke="#0E2A47" stroke-width="1.2"/>

  <!-- Left Column: Total Contributions (as seen in Image 1, 4, 6) -->
  <g transform="translate(60, 42)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" letter-spacing="1">TELEMETRY // AGGREGATE</text>
    <text x="0" y="42" font-family="'Segoe UI', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF">314</text>
    <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748B">Total Contributions</text>
    <text x="0" y="84" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0284C7">YEAR-ROUND COMMIT FLOW</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="330" y1="20" x2="330" y2="140" stroke="#0E2A47" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- CENTER: REAL GLOWING ARC REACTOR (Replacing simple badge with Tony Stark's Arc Reactor!) -->
  <g id="arcReactorGroup">
    <!-- Outer Ticked HUD Ring -->
    <circle cx="475" cy="80" r="54" fill="none" stroke="#0A223B" stroke-width="1.5"/>
    <circle cx="475" cy="80" r="48" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 8" class="arc-spin"/>

    <!-- Segmented Reactor Coils (10 coils) -->
    <g class="arc-spin-rev">
      <!-- 10 Reactor blocks around circumference -->
      <line x1="475" y1="36" x2="475" y2="44" stroke="#00F0FF" stroke-width="3" filter="url(#arcGlow)"/>
      <line x1="500" y1="44" x2="495" y2="51" stroke="#00F0FF" stroke-width="3"/>
      <line x1="517" y1="65" x2="510" y2="69" stroke="#00F0FF" stroke-width="3"/>
      <line x1="517" y1="95" x2="510" y2="91" stroke="#00F0FF" stroke-width="3"/>
      <line x1="500" y1="116" x2="495" y2="109" stroke="#00F0FF" stroke-width="3"/>
      <line x1="475" y1="124" x2="475" y2="116" stroke="#00F0FF" stroke-width="3" filter="url(#arcGlow)"/>
      <line x1="450" y1="116" x2="455" y2="109" stroke="#00F0FF" stroke-width="3"/>
      <line x1="433" y1="95" x2="440" y2="91" stroke="#00F0FF" stroke-width="3"/>
      <line x1="433" y1="65" x2="440" y2="69" stroke="#00F0FF" stroke-width="3"/>
      <line x1="450" y1="44" x2="455" y2="51" stroke="#00F0FF" stroke-width="3"/>
    </g>

    <!-- Inner Core & Palladium Mesh -->
    <circle cx="475" cy="80" r="30" fill="#041226" stroke="#0284C7" stroke-width="2"/>
    <circle cx="475" cy="80" r="22" fill="#021B3A" stroke="#00F0FF" stroke-width="1.5" class="arc-core"/>

    <!-- Central Glowing Triangle & Core -->
    <polygon points="475,66 488,88 462,88" fill="#00F0FF" fill-opacity="0.3" stroke="#00F0FF" stroke-width="1.8" filter="url(#arcGlow)" class="arc-core"/>
    <circle cx="475" cy="80" r="7" fill="#FFFFFF" filter="url(#arcGlow)"/>

    <!-- Label Under Arc Reactor -->
    <text x="475" y="145" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00F0FF" letter-spacing="1.2">
      JARVIS ARC REACTOR // ONLINE
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="620" y1="20" x2="620" y2="140" stroke="#0E2A47" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Right Column: Current Streak & Language Bar -->
  <g transform="translate(670, 42)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" letter-spacing="1">CURRENT STREAK</text>
    <text x="0" y="42" font-family="'Segoe UI', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#34D399">ACTIVE</text>
    <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748B">Continuous Synapse Sync</text>
    <text x="0" y="84" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00F0FF">PYTHON • JS • TS • JAVA</text>
  </g>
</svg>
